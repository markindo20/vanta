name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # SDL2 (and SDL_ttf for the text examples) make the sdl_* examples and
      # pong (and their headless smoke tests) runnable; without them those
      # tests skip.
      - name: Set up SDL2 and SDL_ttf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev
      - name: Set up SDL2 and SDL_ttf (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_ttf

      # Linux and macOS runners ship a C++17 compiler on PATH (g++ / clang++).
      # Windows runners also have MSVC, and the driver prefers cl there, so
      # install MSYS2's mingw-w64 toolchain, put it on PATH (it also supplies
      # the DLLs the compiled test binaries need, SDL2 included), and pin CXX
      # to g++ so Windows matches the toolchain used in development.
      - name: Set up mingw-w64 (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf
      - name: Expose mingw-w64 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CXX=g++" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Version
        run: python main.py --version
      - name: Tests
        run: python -m unittest discover -s tests
